<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #0a0a0a;
  color: #e8e8e8;
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  flex-direction: column;
  padding: 80px 90px;
  overflow: hidden;
}
.tag {
  display: inline-block;
  background: #ea580c;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  padding: 8px 20px;
  border-radius: 8px;
  margin-bottom: 28px;
  letter-spacing: 2px;
}
.title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 52px;
  font-weight: 700;
  color: #ea580c;
  margin-bottom: 12px;
}
.title-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px;
  color: #666;
  margin-bottom: 32px;
}
.problem {
  font-size: 34px;
  color: #999;
  margin-bottom: 12px;
  line-height: 1.5;
}
.problem .emoji { margin-right: 8px; }
.solution {
  font-size: 36px;
  font-weight: 700;
  color: #e8e8e8;
  margin-bottom: 36px;
  line-height: 1.5;
}
.solution .accent { color: #ea580c; }

.screenshot-area {
  width: 820px;
  height: 300px;
  background: #111;
  border: 1px solid #333;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  margin-bottom: 32px;
}
.screenshot-placeholder {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  color: #333;
  letter-spacing: 4px;
}

.points {
  display: flex;
  flex-direction: column;
  gap: 24px;
  margin-bottom: 24px;
}
.point {
  display: flex;
  align-items: flex-start;
  gap: 20px;
}
.point-icon {
  width: 44px;
  height: 44px;
  background: rgba(234, 88, 12, 0.15);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  margin-top: 2px;
}
.point-text {
  font-size: 30px;
  line-height: 1.5;
  color: #ccc;
}
.point-text strong { color: #e8e8e8; }

.tip-box {
  background: rgba(234, 88, 12, 0.08);
  border-left: 4px solid #ea580c;
  padding: 20px 24px;
  border-radius: 0 12px 12px 0;
}
.tip-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  color: #ea580c;
  font-weight: 700;
  margin-bottom: 8px;
}
.tip-text {
  font-size: 26px;
  color: #999;
  line-height: 1.5;
}
.tip-text code {
  font-family: 'JetBrains Mono', monospace;
  background: rgba(234, 88, 12, 0.15);
  padding: 2px 8px;
  border-radius: 4px;
  color: #ea580c;
  font-size: 24px;
}

.slide-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  color: #444;
  position: absolute;
  bottom: 40px;
  right: 50px;
}
</style>
</head>
<body>
  <div class="tag">02 RESUME</div>
  <div class="title">claude --resume</div>
  <div class="title-sub">（省略: -r）</div>
  <div class="problem"><span class="emoji">🤔</span>複数セッションがあってどれを再開すればいいかわからない</div>
  <div class="solution"><span class="accent">→</span> --resumeでセッション一覧から選択して再開</div>
  <div class="screenshot-area">
    <img src="" alt="SCREENSHOT" style="display:none; width:100%; height:100%; object-fit:cover;">
    <div class="screenshot-placeholder">SCREENSHOT</div>
  </div>
  <div class="points">
    <div class="point">
      <div class="point-icon">★</div>
      <div class="point-text">名前指定で<strong>特定のセッション</strong>を即再開</div>
    </div>
    <div class="point">
      <div class="point-icon">↔</div>
      <div class="point-text"><strong>複数タスクの切り替え</strong>に最適</div>
    </div>
  </div>
  <div class="tip-box">
    <div class="tip-label">TIP</div>
    <div class="tip-text"><code>/rename</code>で名前をつけておくと<code>claude --resume "名前"</code>で即再開できる</div>
  </div>
  <div class="slide-count">3 / 5</div>
</body>
</html>
