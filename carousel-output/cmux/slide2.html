<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #f8f6f3;
  color: #1a1a1a;
  font-family: 'Noto Sans JP', sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 80px 90px;
  position: relative;
}
.tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #fff;
  background: #2563eb;
  padding: 8px 20px;
  border-radius: 8px;
  margin-bottom: 36px;
}
.title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 52px;
  font-weight: 700;
  margin-bottom: 12px;
}
.description {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 44px;
}
.terminal {
  background: #1e293b;
  border-radius: 16px;
  width: 100%;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  overflow: hidden;
  margin-bottom: 44px;
}
.terminal-bar {
  background: #334155;
  height: 36px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 7px;
}
.terminal-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
}
.terminal-dot.red { background: #ef4444; }
.terminal-dot.yellow { background: #eab308; }
.terminal-dot.green { background: #22c55e; }
.terminal-body {
  padding: 20px 24px;
  display: flex;
  gap: 12px;
}
.pane {
  flex: 1;
  border: 2px solid #334155;
  border-radius: 8px;
  padding: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  line-height: 1.8;
  color: #94a3b8;
  position: relative;
}
.pane.active {
  border-color: #2563eb;
  box-shadow: 0 0 12px rgba(37, 99, 235, 0.25);
}
.pane-label {
  position: absolute;
  top: -10px;
  left: 12px;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  background: #334155;
  color: #94a3b8;
}
.pane.active .pane-label {
  background: #2563eb;
  color: #fff;
}
.pane .cmd { color: #60a5fa; }
.pane .str { color: #fbbf24; }
.pane .flag { color: #4ade80; }
.pane .prompt { color: #4ade80; }
.points {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.point {
  font-size: 32px;
  font-weight: 400;
  line-height: 1.4;
  display: flex;
  align-items: center;
  gap: 16px;
}
.point-icon {
  font-size: 28px;
  flex-shrink: 0;
  width: 40px;
  text-align: center;
}
.slide-counter {
  position: absolute;
  bottom: 40px;
  right: 60px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  color: #bbb;
}
</style>
</head>
<body>
<div class="tag">01 PANE</div>
<div class="title">Cmd+D</div>
<div class="description">ペインを追加して並列で動かす</div>
<div class="terminal">
  <div class="terminal-bar">
    <div class="terminal-dot red"></div>
    <div class="terminal-dot yellow"></div>
    <div class="terminal-dot green"></div>
  </div>
  <div class="terminal-body">
    <div class="pane active">
      <div class="pane-label">PANE 1</div>
      <div><span class="prompt">$</span> <span class="cmd">claude</span></div>
      <div><span class="str">Fixing auth bug...</span></div>
    </div>
    <div class="pane">
      <div class="pane-label">PANE 2</div>
      <div><span class="prompt">$</span> <span class="cmd">claude</span></div>
      <div><span class="str">Writing tests...</span></div>
    </div>
  </div>
</div>
<div class="points">
  <div class="point"><span class="point-icon">&#x21C4;</span>複数のClaude Codeを並列で稼働</div>
  <div class="point"><span class="point-icon">&#x1F441;</span>他のペインの内容を読み取れる</div>
  <div class="point"><span class="point-icon">&#x1F4E4;</span>他のペインに指示を送れる</div>
</div>
<div class="slide-counter">2 / 5</div>
</body>
</html>
