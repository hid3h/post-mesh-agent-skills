<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #f8f6f3;
  color: #1a1a1a;
  font-family: 'Noto Sans JP', sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 80px 90px;
  position: relative;
}
.tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #fff;
  background: #2563eb;
  padding: 8px 20px;
  border-radius: 8px;
  margin-bottom: 36px;
}
.title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 52px;
  font-weight: 700;
  margin-bottom: 12px;
}
.description {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 44px;
}
.ring-container {
  background: #1e293b;
  border-radius: 16px;
  width: 100%;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 50px 0;
  margin-bottom: 44px;
  position: relative;
  overflow: hidden;
}
.ring {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 6px solid #2563eb;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  box-shadow: 0 0 40px rgba(37, 99, 235, 0.4), 0 0 80px rgba(37, 99, 235, 0.15);
  animation: pulse 2s ease-in-out infinite;
  position: relative;
}
@keyframes pulse {
  0%, 100% {
    box-shadow: 0 0 40px rgba(37, 99, 235, 0.4), 0 0 80px rgba(37, 99, 235, 0.15);
  }
  50% {
    box-shadow: 0 0 60px rgba(37, 99, 235, 0.6), 0 0 120px rgba(37, 99, 235, 0.25);
  }
}
.ring-check {
  font-size: 48px;
  color: #2563eb;
  margin-bottom: 4px;
}
.ring-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 700;
  color: #60a5fa;
}
.points {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.point {
  font-size: 32px;
  font-weight: 400;
  line-height: 1.4;
  display: flex;
  align-items: center;
  gap: 16px;
}
.point-icon {
  font-size: 28px;
  flex-shrink: 0;
  width: 40px;
  text-align: center;
}
.slide-counter {
  position: absolute;
  bottom: 40px;
  right: 60px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  color: #bbb;
}
</style>
</head>
<body>
<div class="tag">03 RING</div>
<div class="title">Blue Ring</div>
<div class="description">ペインが光って完了を知らせる</div>
<div class="ring-container">
  <div class="ring">
    <div class="ring-check">&#x2713;</div>
    <div class="ring-text">Done</div>
  </div>
</div>
<div class="points">
  <div class="point"><span class="point-icon">&#x1F4A1;</span>デフォルトで設定済みのインジケーター</div>
  <div class="point"><span class="point-icon">&#x1F535;</span>ペインが青く光って完了をお知らせ</div>
  <div class="point"><span class="point-icon">&#x1F440;</span>複数ペインでもどれが終わったか一目瞭然</div>
</div>
<div class="slide-counter">4 / 5</div>
</body>
</html>
