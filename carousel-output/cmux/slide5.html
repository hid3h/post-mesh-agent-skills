<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #0a0a0a;
  color: #e8e8e8;
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  flex-direction: column;
  padding: 80px 90px;
  overflow: hidden;
}
.tag {
  display: inline-block;
  background: #ea580c;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  padding: 8px 20px;
  border-radius: 8px;
  margin-bottom: 40px;
  letter-spacing: 2px;
  align-self: flex-start;
}
.title {
  font-size: 52px;
  font-weight: 900;
  color: #e8e8e8;
  margin-bottom: 48px;
}
.feature-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-bottom: 48px;
}
.feature-item {
  display: flex;
  align-items: center;
  gap: 20px;
  background: #111;
  border: 1px solid #222;
  border-radius: 14px;
  padding: 24px 28px;
}
.feature-cmd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  color: #ea580c;
  font-weight: 700;
  white-space: nowrap;
  min-width: 260px;
}
.feature-arrow {
  color: #444;
  font-size: 20px;
  flex-shrink: 0;
}
.feature-desc {
  font-size: 26px;
  color: #999;
  line-height: 1.4;
  flex: 1;
}

.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #333, transparent);
  margin-bottom: 48px;
}

.cta-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.cta-text {
  font-size: 38px;
  font-weight: 900;
  color: #e8e8e8;
  margin-bottom: 16px;
}
.cta-text code {
  font-family: 'JetBrains Mono', monospace;
  color: #ea580c;
  background: rgba(234, 88, 12, 0.1);
  padding: 2px 12px;
  border-radius: 6px;
}
.cta-sub {
  font-size: 26px;
  color: #777;
}
.cta-sub code {
  font-family: 'JetBrains Mono', monospace;
  color: #ea580c;
  background: rgba(234, 88, 12, 0.1);
  padding: 2px 10px;
  border-radius: 4px;
}

.slide-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  color: #444;
  position: absolute;
  bottom: 40px;
  right: 50px;
}
</style>
</head>
<body>
  <div class="tag">+ MORE</div>
  <div class="title">他にもこんな機能が</div>
  <div class="feature-list">
    <div class="feature-item">
      <div class="feature-cmd">cmux read-screen</div>
      <div class="feature-arrow">→</div>
      <div class="feature-desc">他ペインの出力を取得</div>
    </div>
    <div class="feature-item">
      <div class="feature-cmd">cmux tree</div>
      <div class="feature-arrow">→</div>
      <div class="feature-desc">ワークスペース構造を確認</div>
    </div>
    <div class="feature-item">
      <div class="feature-cmd">cmux send "text"</div>
      <div class="feature-arrow">→</div>
      <div class="feature-desc">別ペインにプロンプト送信</div>
    </div>
    <div class="feature-item">
      <div class="feature-cmd">cmux browser open</div>
      <div class="feature-arrow">→</div>
      <div class="feature-desc">ブラウザペインを統合</div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="cta-area">
    <div class="cta-text"><code>brew install cmux</code> で今すぐ始めよう!</div>
    <div class="cta-sub">詳しくは <code>cmux.dev</code></div>
  </div>
  <div class="slide-count">5 / 5</div>
</body>
</html>
