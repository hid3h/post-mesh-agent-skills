<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #f8f6f3;
  color: #1a1a1a;
  font-family: 'Noto Sans JP', sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px 90px;
  position: relative;
}
.tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #fff;
  background: #2563eb;
  padding: 8px 20px;
  border-radius: 8px;
  margin-bottom: 40px;
}
.title {
  font-size: 52px;
  font-weight: 900;
  margin-bottom: 48px;
}
.cards {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-bottom: 48px;
}
.card {
  background: #f0f0ed;
  border-left: 4px solid #2563eb;
  border-radius: 12px;
  padding: 28px 32px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.card-cmd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px;
  font-weight: 700;
  color: #2563eb;
  white-space: nowrap;
  min-width: 180px;
}
.card-arrow {
  font-size: 24px;
  color: #bbb;
  flex-shrink: 0;
}
.card-text {
  font-size: 28px;
  font-weight: 700;
}
.divider {
  height: 2px;
  background: linear-gradient(90deg, #2563eb, rgba(37, 99, 235, 0.08));
  border-radius: 1px;
  margin-bottom: 48px;
}
.cta-box {
  background: rgba(37, 99, 235, 0.08);
  border-radius: 14px;
  padding: 32px 40px;
  text-align: center;
  margin-bottom: 20px;
}
.cta-label {
  font-size: 28px;
  font-weight: 400;
  color: #777;
  margin-bottom: 12px;
}
.cta-cmd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 36px;
  font-weight: 700;
  color: #2563eb;
}
.sub-cta {
  text-align: center;
  font-size: 28px;
  color: #777;
}
.sub-cta span {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  color: #2563eb;
}
.slide-counter {
  position: absolute;
  bottom: 40px;
  right: 60px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  color: #bbb;
}
</style>
</head>
<body>
<div class="tag">SUMMARY</div>
<div class="title">cmuxで開発が変わる</div>
<div class="cards">
  <div class="card">
    <div class="card-cmd">Cmd+D</div>
    <div class="card-arrow">&#x2192;</div>
    <div class="card-text">並列作業で速度UP</div>
  </div>
  <div class="card">
    <div class="card-cmd">Auto Notify</div>
    <div class="card-arrow">&#x2192;</div>
    <div class="card-text">待ち時間を自由時間に</div>
  </div>
  <div class="card">
    <div class="card-cmd">Blue Ring</div>
    <div class="card-arrow">&#x2192;</div>
    <div class="card-text">完了が一目でわかる</div>
  </div>
</div>
<div class="divider"></div>
<div class="cta-box">
  <div class="cta-label">で始めよう</div>
  <div class="cta-cmd">brew install cmux</div>
</div>
<div class="sub-cta">詳しくは <span>cmux.dev</span></div>
<div class="slide-counter">5 / 5</div>
</body>
</html>
