<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #f8f6f3;
  color: #1a1a1a;
  font-family: 'Noto Sans JP', sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 80px 90px;
  position: relative;
}
.tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #fff;
  background: #2563eb;
  padding: 8px 20px;
  border-radius: 8px;
  margin-bottom: 36px;
}
.title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 52px;
  font-weight: 700;
  margin-bottom: 12px;
}
.description {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 44px;
}
.terminal {
  background: #1e293b;
  border-radius: 16px;
  width: 100%;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  overflow: hidden;
  margin-bottom: 44px;
}
.terminal-bar {
  background: #334155;
  height: 36px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 7px;
}
.terminal-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
}
.terminal-dot.red { background: #ef4444; }
.terminal-dot.yellow { background: #eab308; }
.terminal-dot.green { background: #22c55e; }
.terminal-body {
  padding: 24px 28px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  line-height: 2;
}
.terminal-line {
  color: #94a3b8;
}
.terminal-line .prompt { color: #4ade80; }
.terminal-line .cmd { color: #60a5fa; }
.terminal-line .flag { color: #4ade80; }
.terminal-line .str { color: #fbbf24; }
.terminal-line .comment { color: #64748b; }
.notify-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(37, 99, 235, 0.15);
  border: 1px solid rgba(37, 99, 235, 0.3);
  border-radius: 10px;
  padding: 14px 24px;
  margin-top: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  color: #60a5fa;
}
.notify-icon {
  font-size: 24px;
}
.points {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.point {
  font-size: 32px;
  font-weight: 400;
  line-height: 1.4;
  display: flex;
  align-items: center;
  gap: 16px;
}
.point-icon {
  font-size: 28px;
  flex-shrink: 0;
  width: 40px;
  text-align: center;
}
.slide-counter {
  position: absolute;
  bottom: 40px;
  right: 60px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  color: #bbb;
}
</style>
</head>
<body>
<div class="tag">02 NOTIFY</div>
<div class="title">cmux notify</div>
<div class="description">席を離れていても完了がわかる</div>
<div class="terminal">
  <div class="terminal-bar">
    <div class="terminal-dot red"></div>
    <div class="terminal-dot yellow"></div>
    <div class="terminal-dot green"></div>
  </div>
  <div class="terminal-body">
    <div class="terminal-line"><span class="prompt">$</span> <span class="cmd">cmux notify</span> <span class="flag">--on</span> <span class="str">complete</span></div>
    <div class="terminal-line"><span class="comment"># タスクが終わったら通知</span></div>
    <div class="terminal-line" style="margin-top: 4px;"><span class="prompt">$</span> <span class="cmd">cmux notify</span> <span class="flag">--sound</span></div>
    <div class="terminal-line"><span class="comment"># サウンドで知らせる</span></div>
    <div class="notify-badge">
      <span class="notify-icon">&#x1F514;</span>
      <span>Task completed in Pane 1</span>
    </div>
  </div>
</div>
<div class="points">
  <div class="point"><span class="point-icon">&#x1F514;</span>作業が終わったら通知が届く</div>
  <div class="point"><span class="point-icon">&#x2615;</span>席を離れていても完了がわかる</div>
  <div class="point"><span class="point-icon">&#x26A1;</span>「終わった？」の確認作業がゼロに</div>
</div>
<div class="slide-counter">3 / 5</div>
</body>
</html>
