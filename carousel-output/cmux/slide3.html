<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #f8f6f3;
  color: #1a1a1a;
  font-family: 'Noto Sans JP', sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 80px 90px;
  position: relative;
}
.tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #fff;
  background: #2563eb;
  padding: 8px 20px;
  border-radius: 8px;
  margin-bottom: 36px;
}
.title {
  font-size: 52px;
  font-weight: 900;
  margin-bottom: 12px;
}
.description {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 48px;
}
.notification-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  margin-bottom: 52px;
}
.notification-card {
  background: #fff;
  border-radius: 16px;
  padding: 28px 36px;
  width: 100%;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
  display: flex;
  align-items: center;
  gap: 20px;
}
.notification-icon {
  width: 56px;
  height: 56px;
  background: #2563eb;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
}
.notification-content {
  flex: 1;
}
.notification-app {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  color: #64748b;
  margin-bottom: 4px;
}
.notification-title {
  font-size: 28px;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 2px;
}
.notification-body {
  font-size: 22px;
  color: #64748b;
}
.notification-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  color: #94a3b8;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 4px;
}
.badge-row {
  display: flex;
  gap: 16px;
  justify-content: center;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(37, 99, 235, 0.1);
  border: 1px solid rgba(37, 99, 235, 0.25);
  border-radius: 10px;
  padding: 12px 24px;
  font-size: 22px;
  font-weight: 700;
  color: #2563eb;
}
.points {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.point {
  font-size: 32px;
  font-weight: 400;
  line-height: 1.4;
  display: flex;
  align-items: center;
  gap: 16px;
}
.point-icon {
  font-size: 28px;
  flex-shrink: 0;
  width: 40px;
  text-align: center;
}
.point strong {
  font-weight: 700;
}
.slide-counter {
  position: absolute;
  bottom: 40px;
  right: 60px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  color: #bbb;
}
</style>
</head>
<body>
<div class="tag">02 NOTIFY</div>
<div class="title">自動通知</div>
<div class="description">席を離れていても完了がわかる</div>
<div class="notification-area">
  <div class="notification-card">
    <div class="notification-icon">&#x1F514;</div>
    <div class="notification-content">
      <div class="notification-app">cmux</div>
      <div class="notification-title">Pane 1: タスク完了</div>
      <div class="notification-body">すべての変更が正常にコミットされました</div>
    </div>
    <div class="notification-time">now</div>
  </div>
  <div class="badge-row">
    <div class="badge">&#x2705; 設定不要</div>
    <div class="badge">&#x1F50A; サウンド通知</div>
  </div>
</div>
<div class="points">
  <div class="point"><span class="point-icon">&#x1F514;</span><strong>デフォルトで通知ON</strong> — 設定不要</div>
  <div class="point"><span class="point-icon">&#x2615;</span>席を離れていても完了がわかる</div>
  <div class="point"><span class="point-icon">&#x26A1;</span>複数ペインの進捗も見逃さない</div>
</div>
<div class="slide-counter">3 / 5</div>
</body>
</html>
