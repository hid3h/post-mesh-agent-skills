<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #f8f6f3;
  color: #1a1a1a;
  font-family: 'Noto Sans JP', sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}
.top-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 4px;
  color: #777;
  margin-bottom: 40px;
}
.main-title {
  font-size: 58px;
  font-weight: 900;
  line-height: 1.25;
  text-align: center;
  margin-bottom: 24px;
}
.main-title .accent {
  color: #2563eb;
}
.subtitle {
  font-size: 34px;
  font-weight: 400;
  color: #777;
  text-align: center;
  margin-bottom: 60px;
}
.terminal {
  background: #1e293b;
  border-radius: 16px;
  padding: 0;
  width: 700px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  overflow: hidden;
}
.terminal-bar {
  background: #334155;
  height: 40px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 8px;
}
.terminal-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}
.terminal-dot.red { background: #ef4444; }
.terminal-dot.yellow { background: #eab308; }
.terminal-dot.green { background: #22c55e; }
.terminal-body {
  padding: 28px 32px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  line-height: 2;
}
.terminal-line {
  color: #94a3b8;
}
.terminal-line .prompt {
  color: #4ade80;
}
.terminal-line .cmd {
  color: #60a5fa;
}
.terminal-line .flag {
  color: #4ade80;
}
.terminal-line .str {
  color: #fbbf24;
}
.cursor {
  display: inline-block;
  width: 10px;
  height: 24px;
  background: #60a5fa;
  vertical-align: middle;
  animation: blink 1s step-end infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.slide-counter {
  position: absolute;
  bottom: 40px;
  right: 60px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  color: #bbb;
}
</style>
</head>
<body>
<div class="top-label">CLAUDE CODE USERS</div>
<div class="main-title">
  <span class="accent">cmux</span><br>
  コーディングエージェントの<br>ためのターミナル
</div>
<div class="subtitle">Claude Codeを並列で走らせ、通知で見守る</div>
<div class="terminal">
  <div class="terminal-bar">
    <div class="terminal-dot red"></div>
    <div class="terminal-dot yellow"></div>
    <div class="terminal-dot green"></div>
  </div>
  <div class="terminal-body">
    <div class="terminal-line"><span class="prompt">$</span> <span class="cmd">brew install</span> <span class="str">cmux</span></div>
    <div class="terminal-line"><span class="prompt">$</span> <span class="cmd">cmux</span> <span class="flag">--start</span></div>
    <div class="terminal-line"><span class="prompt">$</span> <span class="cursor"></span></div>
  </div>
</div>
<div class="slide-counter">1 / 5</div>
</body>
</html>
