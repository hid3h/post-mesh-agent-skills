<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #0a0a0a;
  color: #e8e8e8;
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  flex-direction: column;
  padding: 80px 90px;
  overflow: hidden;
}
.tag {
  display: inline-block;
  background: #ea580c;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  padding: 8px 20px;
  border-radius: 8px;
  margin-bottom: 32px;
  letter-spacing: 2px;
}
.title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 52px;
  font-weight: 700;
  color: #ea580c;
  margin-bottom: 16px;
}
.desc {
  font-size: 36px;
  font-weight: 700;
  color: #e8e8e8;
  margin-bottom: 40px;
}
.terminal {
  width: 100%;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 44px;
  box-shadow: 0 0 40px rgba(234, 88, 12, 0.1);
}
.terminal-bar {
  background: #1a1a1a;
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 10px;
}
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot-red { background: #ef4444; }
.dot-yellow { background: #eab308; }
.dot-green { background: #22c55e; }
.terminal-body {
  background: #111;
  padding: 32px 40px;
}
.prompt-line {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px;
  color: #666;
  line-height: 2;
}
.prompt-line .cmd { color: #ea580c; }
.prompt-line .flag { color: #22c55e; }
.prompt-line .str { color: #facc15; }

.diagram {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 44px;
}
.branch-box {
  background: #111;
  border: 2px solid #333;
  border-radius: 12px;
  padding: 20px 28px;
  text-align: center;
}
.branch-box.original {
  border-color: #555;
}
.branch-box.forked {
  border-color: #ea580c;
  box-shadow: 0 0 20px rgba(234, 88, 12, 0.2);
}
.branch-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  color: #666;
  margin-bottom: 8px;
}
.branch-name {
  font-size: 24px;
  font-weight: 700;
}
.branch-box.original .branch-name { color: #999; }
.branch-box.forked .branch-name { color: #ea580c; }
.arrow {
  font-size: 40px;
  color: #ea580c;
}
.branch-status {
  font-size: 18px;
  color: #666;
  margin-top: 8px;
}

.points {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 28px;
}
.point {
  display: flex;
  align-items: flex-start;
  gap: 20px;
}
.point-icon {
  width: 44px;
  height: 44px;
  background: rgba(234, 88, 12, 0.15);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  margin-top: 2px;
}
.point-text {
  font-size: 30px;
  line-height: 1.5;
  color: #ccc;
}
.point-text strong { color: #e8e8e8; }
.slide-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  color: #444;
  position: absolute;
  bottom: 40px;
  right: 50px;
}
</style>
</head>
<body>
  <div class="tag">03 FORK</div>
  <div class="title">--fork-session</div>
  <div class="desc">今の流れを壊さず別方針を試す</div>
  <div class="terminal">
    <div class="terminal-bar">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
    </div>
    <div class="terminal-body">
      <div class="prompt-line">$ <span class="cmd">claude</span> <span class="flag">--continue --fork-session</span></div>
      <div class="prompt-line">$ <span class="cmd">claude</span> <span class="flag">--resume</span> <span class="str">"my-task"</span> <span class="flag">--fork-session</span></div>
    </div>
  </div>
  <div class="diagram">
    <div class="branch-box original">
      <div class="branch-label">ORIGINAL</div>
      <div class="branch-name">session-A</div>
      <div class="branch-status">そのまま残る</div>
    </div>
    <div class="arrow">→</div>
    <div class="branch-box forked">
      <div class="branch-label">FORKED</div>
      <div class="branch-name">session-B</div>
      <div class="branch-status">新しい方向へ</div>
    </div>
  </div>
  <div class="points">
    <div class="point">
      <div class="point-icon">😰</div>
      <div class="point-text">「試したいけど<strong>壊したくない</strong>」→ <strong>分岐で安全に</strong></div>
    </div>
    <div class="point">
      <div class="point-icon">◇</div>
      <div class="point-text">元セッションは<strong>そのまま残る</strong></div>
    </div>
    <div class="point">
      <div class="point-icon">⌥</div>
      <div class="point-text">gitの<strong>ブランチ</strong>と同じ感覚</div>
    </div>
  </div>
  <div class="slide-count">4 / 5</div>
</body>
</html>
