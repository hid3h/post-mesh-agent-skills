<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #0a0a0a;
  color: #e8e8e8;
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  flex-direction: column;
  padding: 80px 90px;
  overflow: hidden;
}
.tag {
  display: inline-block;
  background: #ea580c;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  padding: 8px 20px;
  border-radius: 8px;
  margin-bottom: 40px;
  letter-spacing: 2px;
}
.title {
  font-size: 52px;
  font-weight: 900;
  color: #e8e8e8;
  margin-bottom: 48px;
}
.feature-list {
  display: flex;
  flex-direction: column;
  gap: 24px;
  margin-bottom: 56px;
}
.feature-item {
  display: flex;
  align-items: center;
  gap: 20px;
  background: #111;
  border: 1px solid #222;
  border-radius: 14px;
  padding: 24px 28px;
  transition: border-color 0.3s;
}
.feature-item:hover { border-color: #ea580c; }
.feature-desc {
  font-size: 26px;
  color: #999;
  line-height: 1.4;
  flex: 1;
}
.feature-arrow {
  color: #ea580c;
  font-size: 28px;
  flex-shrink: 0;
  font-weight: 700;
}
.feature-cmd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  color: #ea580c;
  font-weight: 700;
  white-space: nowrap;
  min-width: 300px;
  text-align: right;
}

.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #333, transparent);
  margin-bottom: 48px;
}

.cta-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.cta-text {
  font-size: 40px;
  font-weight: 900;
  color: #e8e8e8;
  margin-bottom: 16px;
}
.cta-sub {
  font-size: 26px;
  color: #777;
}
.cta-sub code {
  font-family: 'JetBrains Mono', monospace;
  color: #ea580c;
  background: rgba(234, 88, 12, 0.1);
  padding: 2px 10px;
  border-radius: 4px;
}

.slide-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  color: #444;
  position: absolute;
  bottom: 40px;
  right: 50px;
}
</style>
</head>
<body>
  <div class="tag">SUMMARY</div>
  <div class="title">今日のまとめ</div>
  <div class="feature-list">
    <div class="feature-item">
      <div class="feature-desc">セッション閉じちゃった</div>
      <div class="feature-arrow">→</div>
      <div class="feature-cmd">claude --continue</div>
    </div>
    <div class="feature-item">
      <div class="feature-desc">どのセッション再開する？</div>
      <div class="feature-arrow">→</div>
      <div class="feature-cmd">claude --resume</div>
    </div>
    <div class="feature-item">
      <div class="feature-desc">壊さず別方針を試したい</div>
      <div class="feature-arrow">→</div>
      <div class="feature-cmd">--fork-session</div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="cta-area">
    <div class="cta-text">セッション管理を覚えると作業効率が段違い</div>
    <div class="cta-sub"><code>claude --continue</code> から始めよう</div>
  </div>
  <div class="slide-count">5 / 5</div>
</body>
</html>
