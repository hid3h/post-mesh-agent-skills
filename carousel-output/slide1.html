<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #0a0a0a;
  color: #e8e8e8;
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
.terminal {
  width: 820px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(234, 88, 12, 0.15);
}
.terminal-bar {
  background: #1a1a1a;
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 10px;
}
.dot { width: 14px; height: 14px; border-radius: 50%; }
.dot-red { background: #ef4444; }
.dot-yellow { background: #eab308; }
.dot-green { background: #22c55e; }
.terminal-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: #666;
  margin-left: 12px;
}
.terminal-body {
  background: #111;
  padding: 40px 48px;
}
.prompt-line {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  color: #666;
  margin-bottom: 8px;
}
.prompt-line .cursor {
  display: inline-block;
  width: 14px;
  height: 28px;
  background: #ea580c;
  animation: blink 1s step-end infinite;
  vertical-align: middle;
  margin-left: 4px;
}
@keyframes blink { 50% { opacity: 0; } }
.prompt-line .cmd { color: #ea580c; }

.top-label {
  font-size: 24px;
  color: #ea580c;
  font-weight: 700;
  letter-spacing: 4px;
  margin-bottom: 40px;
}
.main-title {
  font-size: 72px;
  font-weight: 900;
  line-height: 1.3;
  margin-bottom: 32px;
  text-align: center;
}
.main-title .accent {
  color: #ea580c;
}
.subtitle {
  font-size: 32px;
  color: #999;
  text-align: center;
  margin-bottom: 48px;
}
.slide-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  color: #444;
  position: absolute;
  bottom: 40px;
  right: 50px;
}
</style>
</head>
<body>
  <div class="top-label">CLAUDE CODE TIPS</div>
  <div class="main-title">
    知ってた？<br>
    <span class="accent">会話継続テク</span>
  </div>
  <div class="subtitle">continue / resume だけじゃない</div>
  <div class="terminal">
    <div class="terminal-bar">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
      <div class="terminal-title">~ — zsh</div>
    </div>
    <div class="terminal-body">
      <div class="prompt-line">$ <span class="cmd">claude --continue</span></div>
      <div class="prompt-line">$ <span class="cmd">claude --resume "my-task"</span></div>
      <div class="prompt-line">$ <span class="cmd">claude --continue --fork-session</span><span class="cursor"></span></div>
    </div>
  </div>
  <div class="slide-count">1 / 5</div>
</body>
</html>
