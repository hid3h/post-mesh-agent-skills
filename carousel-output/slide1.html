<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #f8f6f3;
  color: #1a1a1a;
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
.terminal {
  width: 820px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(217, 83, 10, 0.1);
}
.terminal-bar {
  background: #e8e5e0;
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 10px;
}
.dot { width: 14px; height: 14px; border-radius: 50%; }
.dot-red { background: #ef4444; }
.dot-yellow { background: #eab308; }
.dot-green { background: #22c55e; }
.terminal-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: #999;
  margin-left: 12px;
}
.terminal-body {
  background: #f0ede8;
  padding: 40px 48px;
}
.prompt-line {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  color: #999;
  margin-bottom: 8px;
}
.prompt-line .cursor {
  display: inline-block;
  width: 14px;
  height: 28px;
  background: #d9530a;
  animation: blink 1s step-end infinite;
  vertical-align: middle;
  margin-left: 4px;
}
@keyframes blink { 50% { opacity: 0; } }
.prompt-line .cmd { color: #d9530a; }

.top-label {
  font-size: 24px;
  color: #d9530a;
  font-weight: 700;
  letter-spacing: 4px;
  margin-bottom: 40px;
}
.main-title {
  font-size: 64px;
  font-weight: 900;
  line-height: 1.3;
  margin-bottom: 24px;
  text-align: center;
}
.main-title .accent {
  color: #d9530a;
}
.subtitle {
  font-size: 36px;
  color: #777;
  text-align: center;
  margin-bottom: 48px;
}
.slide-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  color: #bbb;
  position: absolute;
  bottom: 40px;
  right: 50px;
}
</style>
</head>
<body>
  <div class="top-label">CLAUDE CODE TIPS</div>
  <div class="main-title">
    セッション閉じちゃった...<br>
    <span class="accent">あの作業どこいった？</span>
  </div>
  <div class="subtitle">Claude Codeなら3つのコマンドで解決</div>
  <div class="terminal">
    <div class="terminal-bar">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
      <div class="terminal-title">~ — zsh</div>
    </div>
    <div class="terminal-body">
      <div class="prompt-line">$ <span class="cmd">claude --continue</span></div>
      <div class="prompt-line">$ <span class="cmd">claude --resume "my-task"</span></div>
      <div class="prompt-line">$ <span class="cmd">claude --continue --fork-session</span><span class="cursor"></span></div>
    </div>
  </div>
  <div class="slide-count">1 / 5</div>
</body>
</html>
