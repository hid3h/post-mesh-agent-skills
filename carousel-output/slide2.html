<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: #f8f6f3;
  color: #1a1a1a;
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  flex-direction: column;
  padding: 80px 90px;
  overflow: hidden;
}
.tag {
  display: inline-block;
  background: #d9530a;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  padding: 8px 20px;
  border-radius: 8px;
  margin-bottom: 28px;
  letter-spacing: 2px;
}
.title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 52px;
  font-weight: 700;
  color: #d9530a;
  margin-bottom: 12px;
}
.title-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px;
  color: #999;
  margin-bottom: 32px;
}
.problem {
  font-size: 34px;
  color: #777;
  margin-bottom: 12px;
  line-height: 1.5;
}
.problem .emoji { margin-right: 8px; }
.solution {
  font-size: 36px;
  font-weight: 700;
  color: #1a1a1a;
  margin-bottom: 36px;
  line-height: 1.5;
}
.solution .accent { color: #d9530a; }

.screenshot-area {
  width: 820px;
  height: 300px;
  background: #f0ede8;
  border: 1px solid #ddd;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
  margin-bottom: 36px;
}
.screenshot-placeholder {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  color: #ccc;
  letter-spacing: 4px;
}

.points {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 24px;
}
.point {
  display: flex;
  align-items: flex-start;
  gap: 20px;
}
.point-icon {
  width: 44px;
  height: 44px;
  background: rgba(217, 83, 10, 0.12);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  margin-top: 2px;
}
.point-text {
  font-size: 30px;
  line-height: 1.5;
  color: #555;
}
.point-text strong { color: #1a1a1a; }
.slide-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  color: #bbb;
  position: absolute;
  bottom: 40px;
  right: 50px;
}
</style>
</head>
<body>
  <div class="tag">01 CONTINUE</div>
  <div class="title">claude --continue</div>
  <div class="title-sub">（省略: -c）</div>
  <div class="problem"><span class="emoji">😱</span>うっかりセッションを閉じてしまった / 翌日に続きをやりたい</div>
  <div class="solution"><span class="accent">→</span> --continueで直前のセッションをすぐ再開</div>
  <div class="screenshot-area">
    <img src="" alt="SCREENSHOT" style="display:none; width:100%; height:100%; object-fit:cover;">
    <div class="screenshot-placeholder">SCREENSHOT</div>
  </div>
  <div class="points">
    <div class="point">
      <div class="point-icon">✓</div>
      <div class="point-text">IDを覚える必要なし、<strong>直前のセッション</strong>を自動選択</div>
    </div>
    <div class="point">
      <div class="point-icon">⚡</div>
      <div class="point-text">会話の<strong>コンテキストがそのまま</strong>復元される</div>
    </div>
  </div>
  <div class="slide-count">2 / 5</div>
</body>
</html>
